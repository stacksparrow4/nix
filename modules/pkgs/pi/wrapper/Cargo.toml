[package]
name = "pi"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.43"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
fuser = "0.19.0"
libc = "0.2.189"
nix = { version = "0.31.4", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shlex = "2.0.1"
tempfile = "3.27.0"
wait-timeout = "0.2.1"
