[package]
name = "sprrw"
version = "0.1.0"
edition = "2024"
description = "Helper CLI for building and updating the sprrw NixOS flake"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"

[profile.release]
opt-level = 2
