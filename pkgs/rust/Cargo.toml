[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0.1"
signal-hook = "0.3"
tempfile = "3.27.0"
wait-timeout = "0.2.1"
